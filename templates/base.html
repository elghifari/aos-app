<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}AOS{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #142131;
    --ink-soft: #34465a;
    --muted: #59697a;
    --paper: #f4f7f9;
    --label: #ffffff;
    --blue: #1746a2;
    --blue-deep: #103375;
    --blue-soft: #dce7fb;
    --line: #bdc9d5;
    --line-strong: #7d8fa3;
    --amber: #9a5a00;
    --amber-bg: #fff0c7;
    --red: #a62e32;
    --red-bg: #fde7e8;
    --green: #176b43;
    --green-bg: #dcf3e7;
    --focus: #ffbf2f;
    --shadow: 0 10px 28px rgba(20, 33, 49, .11);
    --radius-sm: 4px;
    --radius-md: 9px;
    --radius-lg: 18px;
  }
  * { box-sizing: border-box; }
  html { max-width: 100%; scroll-behavior: smooth; }
  body {
    min-width: 280px; margin: 0; color: var(--ink); background: var(--paper);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 100%; text-rendering: optimizeLegibility;
  }
  body::before { content: ""; display: block; height: 7px; background: var(--blue); }
  ::selection { color: #fff; background: var(--blue-deep); }
  a { color: inherit; text-decoration-thickness: .08em; text-underline-offset: .18em; }
  a:hover { text-decoration-color: var(--blue); }
  button, input, textarea, select { font: inherit; }
  button, .button {
    min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .62rem .9rem; color: var(--ink); background: var(--label);
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
    cursor: pointer; font-weight: 680; text-decoration: none;
    transition: background-color .16s ease-out, border-color .16s ease-out, color .16s ease-out, transform .16s ease-out;
  }
  button:hover, .button:hover { border-color: var(--ink); }
  button:active, .button:active { transform: translateY(1px); }
  button.primary, .button.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
  button.primary:hover, .button.primary:hover { background: var(--blue-deep); border-color: var(--blue-deep); }
  button.danger { color: #fff; background: var(--red); border-color: var(--red); }
  button.danger:hover { background: #812126; border-color: #812126; }
  button.small, .button.small { min-height: 36px; padding: .42rem .68rem; font-size: .82rem; }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .skip-link {
    position: fixed; z-index: 100; top: .75rem; left: .75rem; transform: translateY(-160%);
    padding: .65rem .8rem; color: #fff; background: var(--ink); border-radius: var(--radius-sm);
  }
  .skip-link:focus { transform: translateY(0); }
  .wrap { width: min(1180px, calc(100% - 2rem)); margin: 0 auto; padding: 1.2rem 0 4rem; }
  .site-header, header {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    margin-bottom: 1.1rem;
  }
  .brand { display: inline-flex; align-items: center; gap: .72rem; text-decoration: none; font-family: "Barlow Condensed", sans-serif; font-size: 1.08rem; font-weight: 700; letter-spacing: .01em; }
  .brand-mark {
    display: grid; place-items: center; width: 36px; height: 36px; color: #fff; background: var(--blue);
    border-radius: 50% 50% 50% 8px; font-size: .78rem; letter-spacing: .03em;
  }
  .header-actions { display: flex; align-items: center; justify-content: flex-end; gap: .55rem; flex-wrap: wrap; }
  .identity { color: var(--muted); font-size: .82rem; }
  h1, h2, h3 { color: var(--ink); font-family: "Barlow Condensed", sans-serif; line-height: 1.04; text-wrap: balance; }
  h1 { margin: 0; font-size: clamp(1.5rem, 3.3vw, 2.35rem); letter-spacing: -.035em; }
  h2 { margin: 2.4rem 0 .8rem; font-size: 1rem; letter-spacing: .005em; }
  h3 { margin: 0; font-size: 1rem; }
  p { max-width: 72ch; }
  code, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-variant-numeric: tabular-nums; }
  .back-title { display: flex; align-items: center; gap: .65rem; }
  .back-title > div { min-width: 0; }
  .back-title h1 { overflow-wrap: anywhere; }
  .back-link {
    flex: 0 0 auto; width: 40px; height: 40px; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: 50%; text-decoration: none; background: var(--label);
  }
  .muted { color: var(--muted); font-size: .86rem; }
  .small-copy { color: var(--muted); font-size: .8rem; }
  .devbar {
    margin: .7rem 0 1.2rem; padding: .55rem .75rem; color: #684000; background: var(--amber-bg);
    border: 1px solid #d9a92c; border-radius: var(--radius-sm); font-size: .8rem;
  }
  .dispatch-hero {
    position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1fr) auto;
    gap: 1.5rem; align-items: end; min-height: 190px; padding: clamp(1.2rem, 4vw, 2.25rem);
    color: #fff; background: var(--blue); border-radius: var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-sm);
  }
  .dispatch-hero::after {
    content: ""; position: absolute; right: -42px; bottom: -55px; width: 210px; height: 150px;
    border: 18px solid rgba(255, 255, 255, .14); border-left-color: transparent; border-radius: 50%;
    transform: rotate(-8deg); pointer-events: none;
  }
  .dispatch-hero h1 { max-width: 13ch; color: #fff; font-size: clamp(2rem, 6vw, 4.2rem); }
  .dispatch-hero p { margin: .65rem 0 0; color: #e7eefc; }
  .dispatch-summary {
    position: relative; z-index: 1; min-width: 170px; padding: .9rem 1rem; color: var(--ink);
    background: #fff; border-radius: var(--radius-md); box-shadow: var(--shadow);
  }
  .dispatch-summary strong { display: block; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(260px, .8fr); gap: 1.25rem; align-items: start; margin-top: 2.25rem; }
  .dashboard-main, .dashboard-rail { min-width: 0; }
  .dashboard-rail { display: grid; gap: 1rem; }
  main > :is(section, div) + section,
  .task-shell > div:first-child > section + section { margin-top: 2.25rem; }
  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 0 0 .7rem; }
  .section-head h2 { margin: 0; }
  .section-head:first-child { margin-top: 0; }
  .panel, .card {
    --cut: 10px; position: relative; max-width: 100%; color: var(--ink); background: var(--label);
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 1rem;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);
  }
  .panel::before {
    content: ""; position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; opacity: .34;
    background: linear-gradient(var(--ink), var(--ink)) center/1px 9px no-repeat,
                linear-gradient(90deg, var(--ink), var(--ink)) center/9px 1px no-repeat;
    pointer-events: none;
  }
  .card { margin-bottom: .65rem; }
  .panel + .panel { margin-top: 1rem; }
  .panel-title { display: flex; align-items: baseline; justify-content: space-between; gap: .8rem; margin-bottom: .8rem; }
  .panel-title h2 { margin: 0; }
  .manifest {
    position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .8rem 1rem;
    max-width: 100%; padding: 1rem 0; border-top: 1px solid var(--line);
  }
  .manifest:first-child { border-top: 0; padding-top: .1rem; }
  .manifest:last-child { padding-bottom: .1rem; }
  .manifest-title { font-weight: 760; text-decoration: none; overflow-wrap: anywhere; }
  .manifest-meta { margin-top: .16rem; color: var(--muted); font-size: .8rem; }
  .manifest-action { align-self: start; }
  .route {
    grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0;
    width: 100%; max-width: 100%; margin: .15rem 0 0; padding: 0; list-style: none;
  }
  .route li { position: relative; min-width: 0; padding-top: 1rem; color: var(--muted); font-size: .68rem; line-height: 1.25; }
  .route li::before {
    content: ""; position: absolute; z-index: 1; top: 0; left: 0; width: 9px; height: 9px;
    background: var(--label); border: 2px solid var(--line-strong); border-radius: 50%;
  }
  .route li::after { content: ""; position: absolute; top: 4px; left: 9px; width: calc(100% - 9px); height: 2px; background: var(--line); }
  .route li:last-child::after { display: none; }
  .route li.done { color: var(--ink-soft); }
  .route li.done::before, .route li.done::after { background: var(--blue); border-color: var(--blue); }
  .route li.current { color: var(--ink); font-weight: 760; }
  .route li.current::before { width: 12px; height: 12px; top: -2px; background: var(--focus); border: 3px solid var(--ink); }
  .route li.hold::before { border-radius: 2px; background: var(--red); border-color: var(--red); transform: rotate(45deg); }
  .status-stamp, .tag {
    display: inline-flex; align-items: center; min-height: 24px; padding: .14rem .46rem;
    border: 1.5px solid currentColor; border-radius: 2px; font-family: "Barlow Condensed", sans-serif;
    font-size: .74rem; font-weight: 700; letter-spacing: .055em; line-height: 1; text-transform: uppercase;
    vertical-align: middle; transform: rotate(-.7deg); box-shadow: inset 0 0 0 1px rgba(255,255,255,.38);
  }
  .status-stamp { justify-self: start; }
  .tag.amber, .status-stamp.amber { color: #704000; background: var(--amber-bg); }
  .tag.red, .status-stamp.red { color: #812126; background: var(--red-bg); }
  .tag.green, .status-stamp.green { color: #115735; background: var(--green-bg); }
  .attention-list { display: grid; gap: .7rem; }
  .attention-item { padding-top: .75rem; border-top: 1px solid var(--line); }
  .attention-item:first-child { padding-top: 0; border-top: 0; }
  .attention-top { display: flex; justify-content: space-between; gap: .8rem; }
  .age { flex: 0 0 auto; color: var(--muted); font-size: .78rem; font-variant-numeric: tabular-nums; }
  .age.over { color: var(--red); font-weight: 780; }
  .empty {
    padding: 1rem; color: var(--muted); background: rgba(255, 255, 255, .48);
    border: 1px dashed var(--line-strong); border-radius: var(--radius-md); font-size: .88rem;
  }
  .notice-band, .guard { min-width: 0; max-width: 100%; padding: .8rem .9rem; overflow-wrap: anywhere; background: var(--blue-soft); border: 1px solid #9db6e9; border-radius: var(--radius-sm); font-size: .86rem; }
  .guard { margin: .85rem 0; }
  .notice-band.warn, .card.warn { background: var(--red-bg); border-color: #d99598; }
  .notice-band.amber, .card.amber { background: var(--amber-bg); border-color: #d9a92c; }
  .handoff-action { margin-top: 1rem; }
  .card.green-edge, .card.amber-edge, .card.family { border-left-width: 1px; }
  .row { display: flex; justify-content: space-between; gap: .85rem; }
  .row > div, .attention-top > div { min-width: 0; overflow-wrap: anywhere; }
  .title { font-weight: 720; text-decoration: none; }
  dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .4rem 1rem; margin: 0; font-size: .88rem; }
  dt { color: var(--muted); }
  dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
  .task-shell, .review-shell { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(270px, .65fr); gap: 1.25rem; align-items: start; }
  .task-aside, .review-aside { position: sticky; top: 1rem; }
  .review-document { grid-column: 1; grid-row: 1 / span 2; min-width: 0; }
  .artifact-manifest { grid-column: 2; grid-row: 1; }
  .decision-panel { grid-column: 2; grid-row: 2; align-self: start; }
  .task-lead {
    position: relative; max-width: 100%; padding: clamp(1rem, 3vw, 1.5rem); background: var(--label);
    border: 1px solid var(--line); border-radius: var(--radius-sm);
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%);
  }
  .task-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .task-title-row h1 { max-width: 22ch; }
  .document-frame { min-width: 0; max-width: 100%; min-height: 310px; padding: clamp(1rem, 3vw, 1.5rem); background: #fff; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); box-shadow: var(--shadow); }
  pre.filebody {
    margin: 0; padding: 0; overflow-x: auto; color: var(--ink); background: transparent; border: 0; border-radius: 0;
    max-width: 100%; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;
  }
  .decision-form textarea { min-height: 110px; }
  .decision-actions { display: grid; grid-template-columns: 1fr 1fr; gap: .55rem; margin-top: .75rem; }
  .err {
    margin-top: .55rem; padding: .55rem .65rem; color: #812126; background: var(--red-bg);
    border: 1px solid #d99598; border-radius: var(--radius-sm);
    font: .78rem/1.45 ui-monospace, SFMono-Regular, Consolas, monospace; word-break: break-word;
  }
  textarea, input[type=text], select {
    width: 100%; min-height: 44px; padding: .65rem .7rem; color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
  }
  textarea { resize: vertical; }
  input::placeholder, textarea::placeholder { color: #657486; opacity: 1; }
  dialog.notice {
    width: min(29rem, calc(100% - 2rem)); padding: 1.1rem; color: var(--ink); background: #fff;
    border: 1px solid var(--line-strong); border-radius: var(--radius-md); box-shadow: 0 20px 60px rgba(20, 33, 49, .25);
  }
  dialog.notice::backdrop { background: rgba(20, 33, 49, .34); }
  dialog.notice p { margin: .45rem 0 1rem; color: var(--muted); }
  dialog.notice form { text-align: right; }
  .run { padding: .8rem 0; border-top: 1px solid var(--line); font-size: .88rem; }
  .run:first-child { border-top: 0; }
  .run.failed { color: var(--red); }
  .stats { display: flex; gap: .7rem; margin: 1rem 0 .5rem; flex-wrap: wrap; }
  .stat { min-width: 130px; padding: .8rem 1rem; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm); }
  .stat .n { font-size: 1.6rem; font-weight: 780; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .l { margin-top: .2rem; color: var(--muted); font-size: .75rem; }
  .stat.bad { background: var(--red-bg); border-color: #d99598; }
  .stat.bad .n { color: var(--red); }
  table { width: 100%; margin-bottom: .7rem; border-collapse: collapse; background: #fff; border: 1px solid var(--line); font-size: .88rem; }
  th, td { padding: .62rem .72rem; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); background: #edf2f6; font-size: .74rem; font-weight: 760; }
  tr:last-child td { border-bottom: 0; }
  td.over { color: var(--red); font-weight: 760; }
  .stages { display: flex; align-items: center; gap: .35rem; margin-top: .65rem; flex-wrap: wrap; }
  .stage { padding: .18rem .44rem; color: var(--ink); background: #edf2f6; border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: .76rem; font-weight: 700; }
  .stage.amber { color: #704000; background: var(--amber-bg); }
  .stage.green { color: #115735; background: var(--green-bg); }
  .arrow { color: var(--muted); }
  .gate-chip { padding: .18rem .42rem; color: #fff; background: var(--ink); border-radius: var(--radius-sm); font-size: .68rem; font-weight: 760; }
  .gate { margin: .45rem 0 .7rem; padding: .8rem .9rem; background: #fff; border: 1px solid var(--ink); border-radius: var(--radius-sm); font-size: .88rem; }
  .gate-label { margin-bottom: .28rem; font-size: .7rem; font-weight: 800; letter-spacing: .04em; }
  .gate-why { margin-top: .45rem; color: var(--muted); font-size: .8rem; }
  .card.pick { transition: border-color .16s ease-out, background-color .16s ease-out; }
  .card.pick:hover { border-color: var(--blue); background: #f8fbff; }
  .card.pick.disabled { opacity: .58; cursor: not-allowed; }
  @media (prefers-reduced-motion: no-preference) {
    .status-stamp { animation: stamp-in .28s cubic-bezier(.16, 1, .3, 1) 1; }
    .manifest.is-running .route li.current::before { animation: scan-once .8s cubic-bezier(.16, 1, .3, 1) 1; }
    @keyframes stamp-in {
      0% { opacity: .35; transform: translateY(-4px) scale(1.12) rotate(-2deg); filter: blur(1px); }
      100% { opacity: 1; transform: translateY(0) scale(1) rotate(-.7deg); filter: blur(0); }
    }
    @keyframes scan-once {
      0% { box-shadow: 0 0 0 0 rgba(255, 191, 47, .75); }
      100% { box-shadow: 0 0 0 12px rgba(255, 191, 47, 0); }
    }
  }
  @media (max-width: 820px) {
    .wrap { width: min(100% - 1rem, 680px); padding-top: .8rem; }
    .site-header, header { align-items: flex-start; }
    .identity { display: block; text-align: right; }
    .dispatch-hero { grid-template-columns: 1fr; min-height: 0; }
    .dispatch-summary { width: fit-content; min-width: 0; }
    .dashboard-grid, .task-shell, .review-shell { grid-template-columns: 1fr; }
    .review-shell { display: grid; }
    .artifact-manifest { grid-column: 1; grid-row: 1; }
    .review-document { grid-column: 1; grid-row: 2; min-width: 0; }
    .decision-panel { grid-column: 1; grid-row: 3; }
    .task-aside, .review-aside { position: static; }
  }
  @media (max-width: 560px) {
    .wrap { width: min(100% - .75rem, 520px); }
    .site-header, header { display: grid; grid-template-columns: 1fr; }
    .header-actions { justify-content: flex-start; }
    .identity { width: 100%; text-align: left; }
    .dispatch-hero { padding: 1.05rem; border-radius: var(--radius-md) var(--radius-md) var(--radius-sm) var(--radius-sm); }
    .dispatch-hero h1 { font-size: clamp(2rem, 12vw, 3.2rem); }
    .panel, .card, .task-lead { padding: .82rem; }
    .panel-title, .section-head { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; align-items: start; }
    .manifest { grid-template-columns: 1fr; }
    .manifest-action { justify-self: start; }
    .route { grid-template-columns: minmax(0, 1fr); gap: 0; padding: .1rem 0 0; }
    .route li { min-height: 1.45rem; padding: .08rem 0 .42rem 1.35rem; font-size: .68rem; overflow-wrap: anywhere; }
    .route li::before { top: .18rem; left: .1rem; }
    .route li::after { top: .72rem; left: .36rem; width: 2px; height: calc(100% - .25rem); }
    .route li.current::before { top: .05rem; left: 0; }
    .route li:last-child { padding-bottom: 0; }
    .task-title-row, .row { align-items: flex-start; }
    .row { flex-direction: column; gap: .35rem; }
    .decision-actions { grid-template-columns: 1fr; }
    dl { grid-template-columns: 1fr; gap: .12rem; }
    dd { margin-bottom: .5rem; }
    .document-frame { max-height: 62dvh; overflow: auto; overscroll-behavior: contain; }
    table { display: block; overflow-x: auto; white-space: nowrap; }
    h1, h2, h3, p, dd, .muted, .small-copy, .title, .identity { max-width: 100%; overflow-wrap: anywhere; }
    code { max-width: 100%; overflow-wrap: anywhere; word-break: break-all; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="wrap">
  <main id="main">
    {% block body %}{% endblock %}
  </main>
</div>
</body>
</html>
