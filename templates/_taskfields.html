{% set values = values or {} %}
<h2>What to do</h2>
<input type="text" name="title" required maxlength="120"
       value="{{ values.get('title', '') }}"
       placeholder="One line — what should exist when this is done">

<p class="muted" style="margin:.8rem 0 .3rem">
  The brief. For an Amber agent this is also what the signer reads to judge
  whether the output answers the ask — say what the constraint is, not just
  the topic.
</p>
<textarea name="body" rows="7" {{ 'required' if focus and focus.agent_no == '03b' }}
          placeholder="Scope, sources, what must not be claimed, where the output goes">{{ values.get('body', '') }}</textarea>

<h2>Priority</h2>
<select name="priority"
        style="font:inherit; padding:.45rem; border:1px solid var(--line); border-radius:6px">
  {% for value, label in [(1, '1 — urgent'), (2, '2'), (3, '3 — normal'), (4, '4'), (5, '5 — whenever')] %}
  <option value="{{ value }}" {{ 'selected' if values.get('priority', 3) == value }}>{{ label }}</option>
  {% endfor %}
</select>
